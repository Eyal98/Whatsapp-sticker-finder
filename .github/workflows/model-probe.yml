# TEMPORARY: library versions for the Kotlin 2.4 / LiteRT-LM 0.17 upgrade, and the 0.17 embedding
# API. Delete after the upgrade builds.
name: Model probe

on:
  push:
    paths:
      - .github/workflows/model-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Versions
        run: |
          mc() { echo "== $1"; curl -fsS "https://repo1.maven.org/maven2/$1/maven-metadata.xml" | grep -o '<version>[^<]*' | sed 's/<version>//' | tail -n ${2:-15} | tr '\n' ' '; echo; }
          gm() { echo "== $1 ($2)"; curl -fsS "https://dl.google.com/android/maven2/$1/group-index.xml" | grep -o "<$2 versions=\"[^\"]*\"" | sed 's/.*versions="//; s/"$//' | tr ',' '\n' | tail -n ${3:-12} | tr '\n' ' '; echo; }
          mc org/jetbrains/kotlin/kotlin-gradle-plugin 20
          mc com/google/devtools/ksp/symbol-processing-gradle-plugin 25
          mc org/jetbrains/kotlinx/kotlinx-coroutines-core 8
          echo "== AGP 8.x"; curl -fsS "https://dl.google.com/android/maven2/com/android/tools/build/group-index.xml" | grep -o '<gradle versions="[^"]*"' | sed 's/.*versions="//; s/"$//' | tr ',' '\n' | grep '^8\.1[0-9]' | tr '\n' ' '; echo
          echo "== gradle 8.14.x / 9.x"; curl -fsS https://services.gradle.org/versions/all | jq -r '.[] | select(.snapshot==false and .nightly==false and .rcFor=="" and .milestoneFor=="") | .version' | grep -E '^(8\.14|9\.)' | head -20 | tr '\n' ' '; echo
          gm androidx/room room-runtime
          gm androidx/room room-compiler 5
          gm androidx/compose compose-bom 8
          gm androidx/work work-runtime-ktx 6
          gm androidx/core core-ktx 6
          gm androidx/activity activity-compose 6
          gm androidx/lifecycle lifecycle-runtime-compose 6
          echo "== gradle"; curl -fsS https://services.gradle.org/versions/current | jq -r .version
      - name: LiteRT-LM 0.17.1 POM and embedding API
        run: |
          set +e
          v=0.17.1
          base=https://dl.google.com/android/maven2/com/google/ai/edge/litertlm/litertlm-android/$v
          curl -fsS "$base/litertlm-android-$v.pom" | grep -A2 artifactId
          curl -fsSL -o lib.aar "$base/litertlm-android-$v.aar" && unzip -o -q lib.aar classes.jar
          for c in EmbeddingEngine EmbeddingEngineConfig EmbeddingOptions EmbeddingResponse InputData\$Text InputOverflowStrategy; do
            echo "-- $c"
            javap -cp classes.jar "com.google.ai.edge.litertlm.$c" | grep -v 'component[0-9]\|copy\|hashCode\|equals\|toString\|\$default\|DefaultConstructorMarker\|third_party'
          done
          unzip -Z1 classes.jar | grep -i embed
