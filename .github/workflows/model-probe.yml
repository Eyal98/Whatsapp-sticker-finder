# TEMPORARY: checks the model download pages the app links to (exists, gated, files). Delete after.
name: Model probe

on:
  push:
    paths:
      - .github/workflows/model-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gemma 4 cards
        run: |
          api=https://huggingface.co/api/models
          for m in litert-community/gemma-4-E2B-it-litert-lm litert-community/gemma-4-E4B-it-litert-lm; do
            echo "=================== $m"
            curl -sS "$api/$m?blobs=true" | jq -r '"gated: \(.gated // "n/a")", (.siblings[]? | "  \(.rfilename)  \(.size // "") \(.lfs.sha256 // "")")'
            curl -fsSL "https://huggingface.co/$m/raw/main/README.md" -o card.md && head -c 12000 card.md
            echo
            grep -niE "litert-lm|litertlm-android|version|vision|image|multimodal|hebrew|language" card.md | head -60
          done
