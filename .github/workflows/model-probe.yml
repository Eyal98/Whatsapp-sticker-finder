# TEMPORARY: checks the model download pages the app links to (exists, gated, files). Delete after.
name: Model probe

on:
  push:
    paths:
      - .github/workflows/model-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repos
        run: |
          api=https://huggingface.co/api/models
          for m in google/gemma-3n-E2B-it-litert-lm google/gemma-3n-E4B-it-litert-lm \
                   google/gemma-3n-E2B-it-litert-preview google/gemma-3n-E4B-it-litert-preview \
                   litert-community/SigLIP2-base-patch16-224 litert-community/embeddinggemma-300m; do
            echo "=================== $m"
            curl -sS "$api/$m?blobs=true" | jq -r '"gated: \(.gated // "n/a")  private: \(.private // "n/a")  error: \(.error // "")", (.siblings[]? | "  \(.rfilename)  \(.size // "")")' | head -40
          done
      - name: Search
        run: |
          api=https://huggingface.co/api/models
          for q in "search=gemma-3n&author=litert-community" "search=gemma-3n&author=google&limit=40" "search=gemma&author=litert-community&limit=60" "search=litertlm&limit=40&sort=downloads"; do
            echo "== $q"
            curl -sS "$api?$q" | jq -r '.[] | "\(.id)  gated=\(.gated // false)  dl=\(.downloads // 0)  \(.pipeline_tag // "")"'
          done
