# TEMPORARY: surveys on-device text embedding models (files, gating, languages) and the LiteRT-LM
# embedding API. Delete after choosing.
name: Model probe

on:
  push:
    paths:
      - .github/workflows/model-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Languages
        run: |
          for m in ibm-granite/granite-embedding-311m-multilingual-r2 microsoft/harrier-oss-v1-0.6b google/embeddinggemma-300m; do
            echo "=================== $m"
            curl -sS "https://huggingface.co/api/models/$m" | jq -r '"gated: \(.gated // "n/a")  languages: \(.cardData.language // [] | join(","))"'
            curl -fsSL "https://huggingface.co/$m/raw/main/README.md" -o card.md 2>/dev/null && \
              grep -niE "hebrew|\bhe\b|languages|200|100\+|multilingual|MTEB|MMTEB" card.md | cut -c1-300 | head -20
          done
          echo "== litert-community .litertlm embedding bundles"
          curl -sS "https://huggingface.co/api/models?author=litert-community&limit=300" | jq -r '.[].id' | while read m; do
            curl -sS "https://huggingface.co/api/models/$m" | jq -r --arg m "$m" 'select(any(.siblings[]?; .rfilename|endswith(".litertlm"))) | select((.pipeline_tag // "") | test("feature-extraction|sentence-similarity")) | $m'
          done
