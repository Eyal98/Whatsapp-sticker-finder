# TEMPORARY: lists on-device image-text models on Hugging Face, for picking a sticker image
# embedding model. Delete once chosen.
name: Model probe

on:
  push:
    paths:
      - .github/workflows/model-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Model cards
        run: |
          api=https://huggingface.co/api/models
          for m in litert-community/Laya-Multilingual-LiteRT litert-community/laya-LiteRT litert-community/Laya-English-LiteRT \
                   litert-community/SigLIP2-base-patch16-224 litert-community/PE-Core-base-patch16-224; do
            echo "=================== $m"
            curl -fsS "$api/$m?blobs=true" | jq -r '(.siblings[] | "\(.rfilename)  \(.size // "")")' || true
            curl -fsSL "https://huggingface.co/$m/raw/main/README.md" -o card.md && head -c 9000 card.md
            echo
          done
