name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Also verifies the checksum of gradle-wrapper.jar.
      - uses: gradle/actions/setup-gradle@v4

      # Downloads the Tesseract language files and checks them against the SHA-256 hashes
      # pinned in core/ocr/tessdata.properties.
      - name: Fetch OCR language files
        run: ./gradlew --no-daemon :core:ocr:fetchTessdata

      # TEMPORARY: shows which MediaPipe artifacts tasks-genai depends on, to pin tasks-core.
      - name: MediaPipe dependency report
        run: ./gradlew --no-daemon -q :core:caption:dependencies --configuration debugRuntimeClasspath | grep -i -B2 -A2 mediapipe || true

      - name: Unit tests
        run: ./gradlew --no-daemon :core:search:test testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Check APK has no network access
        run: scripts/check-apk-permissions.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload lint and test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
          retention-days: 7
