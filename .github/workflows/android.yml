name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Also verifies the checksum of gradle-wrapper.jar.
      - uses: gradle/actions/setup-gradle@v4

      # Downloads the Tesseract language files and checks them against the SHA-256 hashes
      # pinned in core/ocr/tessdata.properties.
      - name: Fetch OCR language files
        run: ./gradlew --no-daemon :core:ocr:fetchTessdata

      # TEMPORARY: find which MediaPipe artifact/version provides MPImage for tasks-genai.
      - name: MediaPipe dependency report
        run: |
          curl -fsS https://dl.google.com/android/maven2/com/google/mediapipe/group-index.xml || true
          echo
          curl -fsS https://dl.google.com/android/maven2/com/google/mediapipe/tasks-genai/0.10.25/tasks-genai-0.10.25.pom || true

      - name: Unit tests
        run: ./gradlew --no-daemon :core:search:test testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Check APK has no network access
        run: scripts/check-apk-permissions.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload lint and test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
          retention-days: 7
