# TEMPORARY: prints the LiteRT-LM Android library's versions and public API, so .litertlm model
# support can be written against the real signatures. Delete once that code builds.
name: LiteRT-LM API probe

on:
  push:
    paths:
      - .github/workflows/litertlm-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Kotlin level and core API per version
        run: |
          set +e
          google=https://dl.google.com/android/maven2/com/google/ai/edge/litertlm/litertlm-android
          for v in 0.8.0 0.9.0 0.10.2 0.11.0 0.12.0 0.13.1 0.14.0 0.15.0 0.16.1 0.17.1; do
            echo "=================== $v"
            curl -fsS "$google/$v/litertlm-android-$v.pom" | tr -d '\n ' | grep -o '<artifactId>[^<]*</artifactId><version>[^<]*' | sed 's#</artifactId><version># #; s#<artifactId>##'
            rm -rf x && mkdir x && cd x
            curl -fsSL -o lib.aar "$google/$v/litertlm-android-$v.aar" && unzip -o -q lib.aar classes.jar
            unzip -o -q classes.jar 'META-INF/*.kotlin_module' 2>/dev/null
            for m in META-INF/*.kotlin_module; do echo "module $m: $(head -c 16 "$m" | od -An -tx1)"; done
            for c in Engine EngineConfig ConversationConfig Content\$ImageBytes Content\$ImageFile Contents\$Companion Message\$Companion Backend\$CPU; do
              javap -cp classes.jar "com.google.ai.edge.litertlm.$c" 2>/dev/null | grep -E 'public (com|final com|final .*(createConversation|initialize|of|user)\()' | grep -v 'DefaultConstructorMarker\|copy\|\$default'
            done
            javap -cp classes.jar com.google.ai.edge.litertlm.Conversation 2>/dev/null | grep -E 'Message sendMessage\((com.google.ai.edge.litertlm.(Contents|Message)|java.lang.String)\);'
            cd ..
          done
