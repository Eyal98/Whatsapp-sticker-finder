# Renders the Peel-It showreel (tools/showreel) and publishes it to the "showreel" pre-release: the
# 16:9 and 9:16 cuts as MP4 (H.264 + AAC, plays everywhere) and WebM (VP9 + Opus, the frame-exact
# render). The video is drawn and scored in code, so it only needs Chromium and ffmpeg.
name: Showreel

on:
  push:
    branches: ["**"]
    paths:
      - tools/showreel/**
      - .github/workflows/showreel.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: showreel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Chromium and ffmpeg
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -encoders | grep -q libx264

      - name: Render
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node tools/showreel/render.js --mp4

      # The 20-second "What's new" reel: every text that has to be read must stay on screen long
      # enough (fails otherwise), and its MP4s are encoded under 10 MB (GitHub's limit for playing
      # a video inline in a README or release page); the step fails if one isn't.
      - name: What's new reel (reading times, MP4s under 10 MB)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          node tools/showreel/render.js --reel whatsnew --check
          node tools/showreel/render.js --reel whatsnew --mp4 --max-mb 9 --out tools/showreel/out-whatsnew
          ls -l tools/showreel/out-whatsnew
          for f in tools/showreel/out-whatsnew/*.mp4; do
            size=$(stat -c%s "$f"); echo "$f: $size bytes"; [ "$size" -lt 10000000 ]
          done

      # GitHub plays a video inline in a README only when it's uploaded in its web editor, and
      # caps those uploads at 10 MB: a 720p cut at about 8 MB for that.
      - name: README cut (720p, under 10 MB)
        run: |
          cd tools/showreel/out
          in=peel-it-showreel-16x9.mp4
          for pass in 1 2; do
            out=/dev/null; audio=-an; fmt="-f mp4"
            if [ $pass = 2 ]; then out=peel-it-showreel-readme.mp4; audio="-c:a aac -b:a 128k"; fmt="-movflags +faststart"; fi
            ffmpeg -y -loglevel error -i "$in" -vf scale=1280:720:flags=lanczos \
              -c:v libx264 -preset slow -b:v 1500k -maxrate 2200k -bufsize 3000k \
              -pix_fmt yuv420p -profile:v high -pass $pass -passlogfile readme $audio $fmt "$out"
          done
          rm -f readme*.log*
          size=$(stat -c%s peel-it-showreel-readme.mp4)
          echo "README cut: $size bytes"
          [ "$size" -lt 10000000 ]

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l tools/showreel/out
          notes="A 37-second showreel of Peel-It in 16:9 and 9:16, drawn and scored in code (tools/showreel). MP4 (H.264 + AAC) plays everywhere; WebM (VP9 + Opus) is the frame-exact render; peel-it-showreel-readme.mp4 is a 720p cut under 10 MB, for dropping into GitHub's editor. peel-it-whatsnew-16x9.mp4 and peel-it-whatsnew-9x16.mp4 are the 20-second what's-new reel (folders, back up and restore, getting started), each under 10 MB. Rebuilt by the Showreel workflow from ${GITHUB_SHA::7}."
          gh release view showreel >/dev/null 2>&1 || \
            gh release create showreel --prerelease --title "Peel-It showreel" --notes "$notes"
          gh release edit showreel --notes "$notes"
          gh release upload showreel tools/showreel/out/*.mp4 tools/showreel/out/*.webm tools/showreel/out-whatsnew/*.mp4 --clobber
