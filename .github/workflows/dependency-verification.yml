# Keeps gradle/verification-metadata.xml up to date: the SHA-256 of every library and plugin the
# build downloads. With that file in the repository, Gradle refuses any download whose checksum
# doesn't match, so a tampered or swapped artifact fails the build instead of reaching the APK.
#
# When the dependencies change (version catalog, build scripts or the wrapper), this runs the same
# tasks as CI with --write-verification-metadata and commits the updated file to the branch. Check
# the resulting diff like any dependency change: new entries should only be the libraries you added.
name: Dependency verification

on:
  push:
    branches: [main, claude/whatsapp-sticker-search-plugin-diz122]
    paths:
      - gradle/libs.versions.toml
      - gradle/wrapper/**
      - "**/*.gradle.kts"
      - .github/workflows/dependency-verification.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    # Dependabot runs get a read-only token; its updates are recorded once merged.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      # Also verifies the checksum of gradle-wrapper.jar.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # Every task CI runs, so every configuration they resolve is recorded. Unsigned: no secrets
      # in this job.
      - name: Record checksums
        run: >-
          ./gradlew --no-daemon --write-verification-metadata sha256
          :core:search:test testDebugUnitTest lintDebug assembleDebug assembleSideload

      - name: Commit the updated file
        run: |
          git add gradle/verification-metadata.xml
          if git diff --cached --quiet; then
            echo "Checksums already up to date"
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update dependency checksums (gradle/verification-metadata.xml)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
