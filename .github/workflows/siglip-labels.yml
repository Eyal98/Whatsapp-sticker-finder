# Builds the SigLIP2 label embeddings (tools/siglip) and publishes them to the "siglip-labels"
# release, from where the app build downloads them with a pinned SHA-256
# (core/vision/siglip.properties). It then pins the new file itself: commits the updated
# siglip.properties to the same branch and starts the Android build, so adding a label is one
# edit to tools/siglip/labels.tsv.
name: SigLIP labels

on:
  push:
    # Branches only: a release tag shouldn't rebuild and republish the model.
    branches: ["**"]
    paths:
      - tools/siglip/**
      - .github/workflows/siglip-labels.yml
  workflow_dispatch:

permissions:
  # Publish the release and commit the pin.
  contents: write
  # Start the Android build for the pin commit (pushes made with this token don't trigger it).
  actions: write

concurrency:
  group: siglip-labels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MODEL_URL: https://huggingface.co/litert-community/SigLIP2-base-patch16-224/resolve/main/siglip2_base_224_fp16.tflite
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet open_clip_torch timm transformers sentencepiece pillow numpy
          pip list 2>/dev/null | grep -iE "^(torch|torchvision|open.clip|timm|numpy) "

      - name: Image model
        run: |
          curl -fsSL -o siglip2.tflite "$MODEL_URL"
          echo "model sha256 $(sha256sum siglip2.tflite | cut -d' ' -f1)  size $(stat -c%s siglip2.tflite)"

      # The app runs the model with the LiteRT 1.4 interpreter; check that version loads it.
      - name: LiteRT 1.4 compatibility
        run: |
          pip install --quiet "ai-edge-litert==1.4.*" && python - <<'PY' || { echo "LITERT14=no"; pip install --quiet -U ai-edge-litert; }
          import numpy as np
          from ai_edge_litert.interpreter import Interpreter
          import ai_edge_litert
          i = Interpreter(model_path="siglip2.tflite", num_threads=4)
          i.allocate_tensors()
          d = i.get_input_details()[0]
          i.set_tensor(d["index"], np.zeros(d["shape"], np.float32))
          i.invoke()
          print("LITERT14=yes", getattr(ai_edge_litert, "__version__", "?"))
          PY
          pip list 2>/dev/null | grep -i litert

      - name: Build and verify labels
        run: |
          mkdir -p out
          python tools/siglip/build_labels.py --labels tools/siglip/labels.tsv --tflite siglip2.tflite --out out/siglip_labels.bin
          sha=$(sha256sum out/siglip_labels.bin | cut -d' ' -f1)
          mv out/siglip_labels.bin "out/siglip_labels-${sha:0:12}.bin"
          ls -l out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view siglip-labels >/dev/null 2>&1 || \
            gh release create siglip-labels --prerelease --title "SigLIP label embeddings" \
              --notes "Generated by the SigLIP labels workflow from tools/siglip. Downloaded by the app build with a pinned SHA-256."
          gh release upload siglip-labels out/*.bin --clobber

      - name: Pin the new file and build the app
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file=$(ls out/*.bin)
          sha=$(sha256sum "$file" | cut -d' ' -f1)
          url="https://github.com/${{ github.repository }}/releases/download/siglip-labels/$(basename "$file")"
          props=core/vision/siglip.properties
          if grep -qx "labels.sha256=$sha" "$props"; then
            echo "Already pinned: $sha"
            exit 0
          fi
          sed -i -e "s|^labels.url=.*|labels.url=$url|" -e "s|^labels.sha256=.*|labels.sha256=$sha|" "$props"
          git diff -- "$props"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Pin SigLIP label vectors ${sha:0:12} (from tools/siglip/labels.tsv)" -- "$props"
          # Someone may have pushed meanwhile: put the pin on top of their work (it touches one
          # file only the bot writes).
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep $((attempt * 5))
          done
          gh workflow run android.yml --ref "$GITHUB_REF_NAME"
          echo "Pinned $sha and started the Android build on $GITHUB_REF_NAME"
