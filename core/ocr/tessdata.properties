# Tesseract language models bundled into the APK (Apache-2.0).
# "fast" integer models: much smaller and quicker than "best", with little accuracy loss for
# the short, large text found on stickers.
#
# Each file is downloaded at build time and must match its SHA-256 below, or the build fails.
# To update: change base.url, set the hashes to UNPINNED, build once, check the printed hashes
# against a copy you downloaded yourself, and paste them here.
